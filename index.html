<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shripur Kindergarten School</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f2f7f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: #ffffff;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      width: 90%;
      max-width: 360px;
      text-align: center;
    }

    /* ১. লোগোর চারপাশে সবুজ বর্ডার ও গ্লো */
    .school-logo {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      border: 3px solid #2e7d32; /* সবুজ বর্ডার */
      box-shadow: 0 0 12px rgba(46, 125, 50, 0.35); /* সবুজ গ্লো */
      object-fit: cover;
      margin-bottom: 12px;
    }

    /* ২. স্কুলের নাম - ছোট, বোল্ড ও উজ্জ্বল সবুজ */
    .school-name {
      font-size: 17px; /* আগের চেয়ে ছোট */
      font-weight: 800; /* বোল্ড */
      color: #0a7e43; /* উজ্জ্বল সবুজ */
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin: 6px 0;
      line-height: 1.3;
    }

    .sub-heading {
      font-size: 12px;
      color: #c09c38;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .eval-title {
      font-size: 15px;
      color: #2c3e50;
      font-weight: 700;
      margin-bottom: 22px;
    }

    /* ড্রপডাউন ইনপুট */
    .select-box {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 14px;
      border: 1px solid #cfd8dc;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      color: #455a64;
      outline: none;
      box-sizing: border-box;
      background-color: #fff;
    }

    /* ৩. View Result বাটন - জ্বলজ্বলে নীল-সবুজ (Blue-Green Glow) */
    .btn-result {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #00c9a7 0%, #0081cf 100%); /* উজ্জ্বল নীল-সবুজ গ্রেডিয়েন্ট */
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 201, 167, 0.45); /* জ্বলজ্বলে ছায়া */
      transition: all 0.3s ease;
    }

    .btn-result:hover {
      background: linear-gradient(135deg, #00b395 0%, #006bbd 100%);
      box-shadow: 0 8px 24px rgba(0, 201, 167, 0.6);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- লোগো -->
    <img src="your-logo-path.png" alt="School Logo" class="school-logo">
    
    <!-- স্কুলের নাম -->
    <h1 class="school-name">SHRIPUR KINDERGARTEN SCHOOL</h1>
    
    <div class="sub-heading">Jagat Infrastructure & Algorithm</div>
    <div class="eval-title">2<sup>nd</sup> Summative Evaluation - 2026</div>

    <!-- সেলেক্ট বক্স -->
    <select class="select-box">
      <option value="" disabled selected>SELECT CLASS</option>
    </select>

    <select class="select-box">
      <option value="" disabled selected>STUDENTS_NAME</option>
    </select>

    <!-- বাটন -->
    <button class="btn-result">View Result</button>
  </div>

</body>
</html>
